name: Binary Parsing macOS baseline controls
on:
  workflow_dispatch:
    inputs:
      baseline_sha:
        required: true
        type: string
      swift_versions:
        required: true
        default: '["6.2", "6.3", "6.4"]'
        type: string
permissions:
  contents: read
jobs:
  baseline:
    runs-on: macos-26
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        swift: ${{ fromJson(inputs.swift_versions) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.baseline_sha }}
      - name: Verify untouched baseline
        env:
          BASELINE_SHA: ${{ inputs.baseline_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$BASELINE_SHA"
          test -z "$(git status --porcelain)"
      - uses: swift-actions/setup-swift@7e293214cba9e9225c93ce3267f17f6efdb656a8
        with:
          swift-version: ${{ matrix.swift }}
      - run: |
          swift --version
          xcodebuild -version
          swift test
